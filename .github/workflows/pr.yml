name: PR

on:
  pull_request:
    branches: [main]

jobs:
  build:
    uses: purview-dev/build/.github/workflows/purview-build.yml@main
    with:
      # The shared pipeline is resolved at job time rather than pinned: this
      # repository then always runs the current Purview.Build (a pin froze the
      # gate at 0.8.1 while the pipeline moved on to 0.9.1). Only the SDK is
      # pinned, because the runner image's .NET drifts between builds.
      dotnet-version: 11.0.x
    secrets: inherit
