name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
  # A release that failed can be retried without touching package.json: the
  # pipeline is resolved at job time, so a re-dispatch runs the current one.
  workflow_dispatch:

# Serialize releases; the reusable workflow skips when the v{version} tag already exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: purview-dev/build/.github/workflows/purview-release.yml@main
    with:
      # Resolved at job time, like the PR gate (see pr.yml).
      dotnet-version: 11.0.x
      # The site publishes no NuGet package; tag + GitHub release (with the dist zip attached) only.
      release-mode: GitHubRelease
      upload-artifacts: true
    secrets: inherit
