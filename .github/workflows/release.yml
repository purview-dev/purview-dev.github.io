name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json

# Serialize releases; the reusable workflow skips when the v{version} tag already exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: purview-dev/build/.github/workflows/purview-release.yml@main
    with:
      # The site publishes no NuGet package; tag + GitHub release (with the dist zip attached) only.
      release-mode: GitHubRelease
      upload-artifacts: true
    secrets: inherit
