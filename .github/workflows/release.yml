name: Release

on:
  push:
    branches: [main]

# Serialize releases; the reusable workflow skips when the v{version} tag already exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: purview-dev/build/.github/workflows/purview-release.yml@main
    with:
      # The site publishes no NuGet package; tag + GitHub release (with the
      # dist zip attached) only.
      release-mode: GitHubRelease
      upload-artifacts: true
      # Web support landed in Purview.Build 0.3.0; pin the tool version so the
      # shared release is reproducible.
      build-version: 0.3.0
    secrets: inherit