name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pages-base:
        description: >-
          Astro base path for project-level GitHub Pages (e.g. /purview-dev/).
          Leave empty for a custom domain or organisation Pages site.
        required: false
        type: string
        default: ""
  schedule:
    # Weekly refresh of release information from GitHub and NuGet.
    - cron: "17 4 * * 1"
  repository_dispatch:
    # Fired by a release workflow in another purview-dev repository. The
    # expected payload contract is documented in the README.
    types: [purview-site-rebuild]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install Just
        # taiki-e/install-action v2.87.13
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908
        with:
          tool: just@1.58.0

      # The repository is a Bun workspace: the lockfile and root `package.json`
      # live here, the Astro site package lives in `src/`, and every `bun run`
      # / `just` recipe delegates to `src/` (see `package.json` scripts).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run validation
        # `just validate` runs a live data sync on fresh checkouts (no cache /
        # docs mirror yet), so pass a token to avoid unauthenticated rate limits.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just validate

      - name: Refresh live release and documentation data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: DATA_MODE=live bun run data:sync

      - name: Resolve deployment base and site URL
        id: pages-config
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          BASE="${{ vars.PAGES_BASE }}"
          if [ -n "${{ inputs.pages-base }}" ]; then
            BASE="${{ inputs.pages-base }}"
          fi
          if [ -z "$BASE" ]; then
            if [ "$REPO_NAME" = "$OWNER.github.io" ]; then
              BASE="/"
            else
              BASE="/$REPO_NAME"
            fi
          fi
          SITE="${{ vars.SITE_URL }}"
          if [ -z "$SITE" ]; then
            SITE="https://$OWNER.github.io"
          fi
          echo "pages-base=$BASE" >> "$GITHUB_OUTPUT"
          echo "site-url=$SITE" >> "$GITHUB_OUTPUT"

      - name: Build site with live data
        env:
          PAGES_BASE: ${{ steps.pages-config.outputs.pages-base }}
          SITE_URL: ${{ steps.pages-config.outputs.site-url }}
        run: bun run build

      - name: Configure Pages
        # actions/configure-pages v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          # Build output is written into the `src/` package (see package.json).
          path: ./src/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
