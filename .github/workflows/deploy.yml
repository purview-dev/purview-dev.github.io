name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pages-base:
        description: >-
          Astro base path for project-level GitHub Pages (e.g. /purview-dev/).
          Leave empty for a custom domain or organisation Pages site.
        required: false
        type: string
        default: ''
  schedule:
    # Weekly refresh of release information from GitHub and NuGet.
    - cron: '17 4 * * 1'
  repository_dispatch:
    # Fired by a release workflow in another purview-dev repository. The
    # expected payload contract is documented in the README.
    types: [purview-site-rebuild]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install Just
        # taiki-e/install-action v2.87.13
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab
        with:
          tool: just@1.58.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run validation
        run: just validate

      - name: Refresh live release and documentation data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: DATA_MODE=live bun run data:sync

      - name: Build site with live data
        env:
          PAGES_BASE: ${{ inputs.pages-base || '' }}
          SITE_URL: https://purview.dev
        run: bun run build

      - name: Configure Pages
        # actions/configure-pages v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
