useCases:
  - audience: developer
    title: Match a value-type union without boxing a case
    scenario: >-
      A method returns one of a handful of value-type outcomes, and the caller must
      branch on which one it received — but the `union` keyword boxes every
      value-type case on entry and again while matching.
    code: |
      [GenerateUnion(typeof(int), typeof(string))]
      public readonly partial struct IntOrString;

      IntOrString value = 42;

      var message = value switch
      {
          int number => $"int {number}",
          string text => $"string {text}",
          null => "empty",
      };
    language: csharp
    outcome: >-
      The compiler treats the generated type as a union, so implicit conversions,
      exhaustive `switch` and `is`/`null` patterns all work, while construction,
      `TryGetValue`, `is` and `switch` never allocate.
    evidence: >-
      The committed BenchmarkDotNet suite measures construction, both
      `TryGetValue` directions, the miss path, `HasValue`, `is` and both `switch`
      shapes at 0 B; only reading `Value` allocates the 24-byte box for the `int`
      case, which is inherent to the union contract.
    docsPage: performance
  - audience: developer
    title: Declare a union whose cases are type parameters
    scenario: >-
      You want a generic option or outcome type, but `typeof(T)` is not a legal
      attribute argument, so an ordinary `[GenerateUnion(typeof(…))]` list cannot
      name a type parameter.
    code: |
      [GenerateUnion]
      public readonly partial struct Option<T>
      {
          internal static partial Option<T> Some(Some<T> value);
          internal static partial Option<T> None(None value);
      }
    language: csharp
    outcome: >-
      Each partial factory signature names a case, the generator supplies the
      bodies and derives the public constructors from them, and the compiler reports
      `CS0416` only if you try to use a `typeof(T)` list instead.
    evidence: >-
      A generic union must name its cases in source because `CS0416` rejects
      `typeof(T)` in an attribute; a `typeof` list on a generic union is reported
      as `UNI0011`.
    docsPage: union-design
  - audience: architect
    title: Let a second source generator see the union's cases
    scenario: >-
      Another Purview generator — Results, or the telemetry generator unwrapping a
      parameter — must read the case list, but Roslyn generators never see each
      other's generated output.
    code: |
      [GenerateUnion]
      public readonly partial struct Outcome<T> : Outcome<T>.IUnionMembers
      {
          public interface IUnionMembers
          {
              static Outcome<T> Create(T? value) => Outcome<T>.CreateCase0(value);
              static Outcome<T> Create(Exception? error) => Outcome<T>.CreateCase1(error);

              bool TryGetValue(out T value);
              bool TryGetValue(out Exception value);
          }
      }
    language: csharp
    outcome: >-
      A public nested `IUnionMembers` provider exposes the case list in the source
      the other generator compiles against, while this generator still emits the
      storage and `CreateCaseN` methods.
    evidence: >-
      `Purview.Telemetry.SourceGenerator` 6.0.0 reads the source-visible case list in
      the same order as this package, and a `[GenerateUnion]` target with no
      source-visible case list is reported as `UNI0003` rather than unwrapped.
    docsPage: interop
  - audience: contributor
    title: Fail fast on a malformed union declaration
    scenario: >-
      A union is declared without `partial`, with a duplicate case, or with a case
      type less accessible than the union, and the generated shape cannot be emitted
      coherently.
    code: |
      error UNI0001: The union declaration is not partial
      error UNI0004: Duplicate case type
      error UNI0005: A case type is less accessible than the union
    language: plaintext
    outcome: >-
      Every error blocks its union's output rather than emitting a partial shape,
      and the package ships code fixes for the common declarations — add `partial`
      (`UNI0001`), widen an inaccessible case type (`UNI0005`), add `[Union]` on the
      fallback path (`UNI0007`).
    evidence: >-
      `UNI0015` (a single-case union) is the only warning; every other `UNI` rule
      blocks emission, so a malformed union fails the build instead of producing
      half a type.
    docsPage: diagnostics
