$schema: ../../lib/manifest/schema.ts

id: unions
name: Unions
shortDescription: Dependency-free C# 15 unions that do not box value-type cases.
description: >-
  The C# 15 `union` keyword lowers to a single `object?` field, so every
  value-type case is boxed on entry. Purview.Unions generates the language's
  non-boxing custom-union shape instead: each case gets its own typed field, a
  public constructor, and a `TryGetValue` that never allocates. The compiler
  still sees a union — implicit conversions, exhaustive `switch`, and `is`/`null`
  patterns all work — plus a hand-written `Union<T1, T2>` for the two-case shape.
origin: >-
  Discriminated unions were needed for error modelling and optional values, and
  the language's own `union` declaration boxes every value-type case on entry.
  The compiler already exposes the custom-union contract the boxing-free shape
  needs, so the generator that emits it became a shared package instead of a
  hand-written type in each project.
useWhen: >-
  You model a closed set of cases — expected errors, optional results, a
  small state machine — and either the value-type cases are allocation-sensitive
  or you want one type the whole team matches on exhaustively.
avoidWhen: >-
  You target a runtime below .NET 11 with C# 15, or a single shape with two
  reference-type cases is enough: the built-in `union` declaration is simpler
  and the boxing cost does not apply to reference types.
repository: purview-dev/unions
category: source-generation
status: preview
order: 25
