$schema: ../../lib/manifest/schema.ts

id: wsl-containers
name: WSL Containers
shortDescription: Throwaway Linux containers for .NET integration tests on Windows, with no Docker installation.
description: >-
  A Testcontainers-style library for .NET that runs throwaway Linux containers through Microsoft
  WSL Containers (WSLC) instead of a Docker daemon. It talks to the WSLC managed C# API directly
  — no wslc.exe, no docker CLI, no Docker.DotNet — and provides what an integration test needs:
  images and tags, port bindings, bind mounts and named volumes, exec, streamed logs, and
  composable wait strategies. Typed service modules add PostgreSQL, SQL Server, MySQL, Redis,
  RabbitMQ, Azurite, and NATS, each with its own defaults, configuration, readiness wait
  strategy, and connection-string helper.
origin: >-
  Integration tests that use real infrastructure on Windows needed a Docker daemon installed and
  running first. WSL Containers makes the container runtime a Windows feature, so the same
  throwaway-container workflow can be built straight on its managed API. The repository keeps
  the spikes that answered how sessions, mounts, networking, and image storage actually behave,
  and the library was written against those answers rather than against documentation.
useWhen: >-
  You want real PostgreSQL, SQL Server, MySQL, Redis, RabbitMQ, Azurite, or NATS instances in
  integration tests on Windows and already run WSL Containers.
avoidWhen: >-
  You target Linux or macOS, you need a container runtime other than WSL Containers, or you
  require API stability: the public API, defaults, and packaging rules can change between
  prereleases and there is no production support guarantee.
repository: purview-dev/wsl-containers
category: developer-tooling
status: preview
experimental: true
order: 90
docs:
  source: github-path
  path: docs/wiki
  rootPage: Getting-Started.md
  exclude:
    - _Sidebar.md
    - Home.md
    - index.md
targetFrameworks:
  - net11.0-windows
packages:
  - id: Purview.WslContainers
    description: Core runtime — container builder, wait strategies, mounts, networking, exec, and logs.
    primary: true
  - id: Purview.WslContainers.PostgreSql
    description: PostgreSQL module — defaults, configuration, readiness wait strategy, and connection string.
  - id: Purview.WslContainers.MsSql
    description: SQL Server module — defaults, licence acceptance, configuration, and connection string.
  - id: Purview.WslContainers.MySql
    description: MySQL module — defaults, configuration, readiness wait strategy, and connection string.
  - id: Purview.WslContainers.Redis
    description: Redis module — defaults, configuration, readiness wait strategy, and connection string.
  - id: Purview.WslContainers.RabbitMq
    description: RabbitMQ module — defaults, credentials, configuration, and AMQP connection string.
  - id: Purview.WslContainers.Azurite
    description: Azurite module — defaults, account key, and Azure Storage connection string.
  - id: Purview.WslContainers.Nats
    description: NATS module — defaults, configuration, and client endpoint.
useCases:
  - audience: developer
    title: A real PostgreSQL in a test, with no Docker
    scenario: >-
      Your integration tests need a real database. On Windows that usually means installing and
      running a Docker daemon first, so the tests cannot run on a machine that only has WSL
      Containers.
    code: |
      await using var postgres = new PostgreSqlBuilder()
          .WithDatabase("tests")
          .WithPassword("postgres")
          .Build();

      await postgres.StartAsync();   // returns once pg_isready succeeds

      await using var connection = new NpgsqlConnection(postgres.GetConnectionString());
      await connection.OpenAsync();
    language: csharp
    outcome: >-
      The module supplies the image, the defaults, and the readiness wait strategy, so the test
      starts a throwaway PostgreSQL, connects with the connection string it generates, and stops
      and deletes the container when the test ends.
    evidence: >-
      Seven service modules ship — PostgreSQL, SQL Server, MySQL, Redis, RabbitMQ, Azurite, and
      NATS — each with its own builder, wait strategy, and connection-string helper.
    docsPage: modules
  - audience: developer
    title: A generic container from one builder
    scenario: >-
      You need a throwaway container for something the modules do not cover — a scratch Linux
      image, a broker, a cache — and you want it configured the same way as the typed ones.
    code: |
      await using var container = new ContainerBuilder()
          .WithImage("docker.io/library/redis:latest")
          .WithPortBinding(6379, assignRandomHostPort: true)
          .WithWaitStrategy(Wait.ForTcpPort(6379))
          .Build();

      await container.StartAsync();
      ushort port = container.GetMappedPublicPort(6379);
    language: csharp
    outcome: >-
      Build() validates the accumulated configuration; StartAsync() creates the container and
      returns only once every configured wait strategy is satisfied; DisposeAsync() stops and
      deletes the container, and never terminates the shared session underneath it.
    evidence: >-
      The runtime talks to the WSLC managed API directly: no wslc.exe, no docker CLI, and no
      Docker.DotNet anywhere in the dependency graph.
  - audience: architect
    title: One prerequisite instead of a daemon on every machine
    scenario: >-
      You want integration tests that use real infrastructure on Windows developer machines and
      CI agents, without making a Docker daemon part of the minimum toolchain.
    outcome: >-
      The only host prerequisite is WSL Containers, installed with wsl --install
      --no-distribution and verified against WSL 3.0.1.0. A consumer must be a .NET 11 project
      targeting Windows specifically; the packages ship the MSBuild defaults for that, and an
      unsupported target framework is reported as PWC0001 — and a non-64-bit consumer as
      PWC0002 — instead of failing obscurely at runtime.
    evidence: >-
      WslContainerRuntime.GetInfoAsync() reports exactly which prerequisite is missing, and the
      library never installs or updates WSL on its own, so a test run cannot reconfigure a
      developer's machine.
    docsPage: consumer-requirements
  - audience: contributor
    title: Add a service module
    scenario: >-
      You want to add a module for another service, or fix one of the existing seven, and need
      to know exactly what a module is allowed to contribute.
    outcome: >-
      A module supplies only the default image, ports, environment, its own WithXxx
      configuration, a wait strategy, and connection-string helpers. The generic CRTP builder
      base snapshots the accumulated state into an immutable configuration, so modules never
      duplicate container runtime infrastructure.
    evidence: >-
      Each module has its own unit and integration test project, so a new module has a template
      to follow and a place to prove itself.
    docsPage: contributing-modules
