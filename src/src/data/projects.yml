      This was the original exploration of interface-driven logging generation and established the
      approach that later grew into the broader Telemetry SourceGenerator.
    useWhen: >-
      Use it only when maintaining an existing dependency that cannot yet move to its successor.
    avoidWhen: >-
      For new work, use Telemetry SourceGenerator instead; this project is archived and no longer
      actively developed.
    repository: purview-dev/dotnet-logging-source-generators
    category: source-generation
    status: archived
    supersededBy: telemetry-sourcegenerator
    order: 80
    targetFrameworks:
      - net6.0
      - net7.0
    packages: []
    useCases:
      - audience: developer
        title: Move to the supported successor
        scenario: >-
          You depend on the original interface-based logging generator and want logging, activities, and
          metrics generated together.
        outcome: >-
          Telemetry SourceGenerator generates logging alongside Activities and Metrics from the same
          interfaces, with DI registration and multi-targeting.
        evidence: >-
          This project is archived and no longer developed; the successor covers a superset of its
          behaviour from one interface.

