$schema: ../lib/manifest/schema.ts
projects:
  - id: telemetry-sourcegenerator
    name: Telemetry SourceGenerator
    shortDescription: Interface-based telemetry for .NET with zero boilerplate.
    description: >-
      A source generator that turns simple interface methods into
      OpenTelemetry-aligned Activities, structured ILogger logging, and Metrics.
      Define telemetry once on an interface; the generator emits the
      implementation, DI registration helpers, and multi-target generation —
      no runtime reflection, no boilerplate.
    origin: >-
      Repeating the same logging, activity, and metric wiring across services made telemetry a
      strong candidate for one interface-driven, compile-time implementation.
    useWhen: >-
      You want strongly typed OpenTelemetry-aligned telemetry from interfaces, with generated
      implementations and dependency-injection registration.
    avoidWhen: >-
      Your telemetry is highly dynamic, cannot be described at compile time, or is already handled
      consistently by another instrumentation layer.
    repository: purview-dev/telemetry-sourcegenerator
    category: observability
    status: stable
    featured: true
    order: 10
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net8.0
      - net9.0
      - net10.0
    packages:
      - id: Purview.Telemetry.SourceGenerator
        description: Core package with the Roslyn source generator and attribute library.
        primary: true
        targetFrameworks:
          - netstandard2.0
    discussions: false

  - id: event-sourcing
    name: Event Sourcing
    shortDescription: Aggregate-based event sourcing for .NET across any store.
    description: >-
      A .NET event sourcing framework for building aggregate-based applications.
      Provider-agnostic store facades, source-generated aggregates and events,
      transaction coordination for multi-aggregate saves, queryable snapshots
      and read models, and storage providers for SQL Server, PostgreSQL,
      MongoDB, Azure Storage, Azure Cosmos DB, and in-memory.
    origin: >-
      Aggregate, event, persistence, and transaction patterns kept recurring across applications,
      so the reusable parts were separated from any one storage provider.
    useWhen: >-
      Your domain benefits from aggregate-based event sourcing and you want storage choices,
      snapshots, read models, and transactions behind consistent abstractions.
    avoidWhen: >-
      A conventional state-based model is sufficient, or your application does not need the
      operational and modelling trade-offs that come with event sourcing.
    repository: purview-dev/event-sourcing
    category: application-framework
    status: preview
    featured: true
    order: 20
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net8.0
      - net9.0
      - net10.0
    packages:
      - id: Purview.EventSourcing
        description: Core abstractions, aggregates, facades, transactions, DI, and source generation.
        primary: true
      - id: Purview.EventSourcing.SqlServer
        description: Azure SQL / SQL Server event stream and queryable snapshot stores.
      - id: Purview.EventSourcing.Postgres
        description: PostgreSQL event stream and queryable snapshot stores.
      - id: Purview.EventSourcing.AzureStorage
        description: Azure Table / Blob event store.
      - id: Purview.EventSourcing.MongoDB
        description: MongoDB event stream and queryable snapshot stores.
      - id: Purview.EventSourcing.CosmosDb
        description: Azure Cosmos DB queryable snapshot store.
      - id: Purview.EventSourcing.InMemory
        description: In-memory event and snapshot stores for local and test scenarios.
      - id: Purview.EventSourcing.Validation.FluentValidation
        description: FluentValidation adapter for aggregate save-time validation.
      - id: Purview.EventSourcing.Validation.ZodSharp
        description: Purview.ZodSharp adapter for aggregate save-time validation.
    related:
      - zodsharp
      - value-objects
    discussions: false

  - id: zodsharp
    name: ZodSharp
    shortDescription: Zero-allocation schema validation for C# — a Zod port.
    description: >-
      A high-performance schema validation library for C#, ported from
      TypeScript Zod by way of the guinhx/ZodSharp C# port. Struct-based rules,
      a fluent API, JSON Schema export and import, source-generated validators,
      and zero-allocation validation on every valid input path. Integrates with
      System.Text.Json, Newtonsoft.Json, and ASP.NET Core ProblemDetails.
    origin: >-
      Schema validation was repeatedly needed at application boundaries, but existing approaches
      did not combine a fluent Zod-style model with predictable, allocation-conscious execution.
    useWhen: >-
      You want composable C# schemas, compile-time validator generation, or JSON Schema interop with
      tight control over validation behaviour and allocations.
    avoidWhen: >-
      Data annotations or an existing validation library already cover your requirements, or Zod-style
      schemas would add an unnecessary second validation model.
    repository: purview-dev/zodsharp
    category: validation
    status: preview
    featured: true
    order: 30
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net8.0
      - net9.0
      - net10.0
    packages:
      - id: Purview.ZodSharp
        description: Core validation library and source generator.
        primary: true
      - id: Purview.ZodSharp.SystemTextJson
        description: System.Text.Json integration and JSON Schema import.
      - id: Purview.ZodSharp.NewtonsoftJson
        description: Newtonsoft.Json integration and JSON Schema import.
      - id: Purview.ZodSharp.AspNetCore
        description: ASP.NET Core ProblemDetails integration.
    related:
      - value-objects
    acknowledgments:
      - name: Zod
        url: https://github.com/colinhacks/zod
        description: The original JavaScript/TypeScript schema validation library.
      - name: ZodSharp (guinhx)
        url: https://github.com/guinhx/ZodSharp
        description: The C# port of Zod, and the fork this project is based on.

  - id: value-objects
    name: Value Objects
    shortDescription: Source-generated scalar and complex value objects for .NET.
    description: >-
      F#-style single-case types for C#. Mark a partial struct or class with
      [Scalar] or [ValueObject] and an incremental source generator produces
      Create/Hydrate factories with normalization and validation, equality,
      comparison, implicit conversions, JSON converters, and contextual
      creation. Value objects serialize as their underlying value, map cleanly
      onto Entity Framework JSON columns, and can be validated with
      Purview.ZodSharp schemas.
    origin: >-
      Hand-writing the same factories, equality rules, conversions, serializers, and persistence
      integration for domain values made the pattern an obvious source-generation target.
    useWhen: >-
      Your domain uses meaningful scalar or complex value types and you want their repetitive
      implementation generated from a small, explicit declaration.
    avoidWhen: >-
      A primitive or record already expresses the concept clearly, or generated conversion and
      serialization behaviour would be more machinery than the domain needs.
    repository: purview-dev/value-objects
    category: source-generation
    status: preview
    featured: true
    order: 35
    docs:
      source: github-path
      path: docs
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net8.0
      - net9.0
      - net10.0
    packages:
      - id: Purview.ValueObjects
        description: Runtime contracts, source generator, and analyzer for scalar and complex value objects.
        primary: true
    related:
      - zodsharp
      - event-sourcing

  - id: sourcegenerator-framework
    name: SourceGenerator Framework
    shortDescription: A typed framework for building incremental C# source generators.
    description: >-
      A strongly typed framework for building, testing, and maintaining
      incremental C# source generators with Roslyn. Includes structured code
      generation, attribute data models, type libraries, and a step-cache test
      runner for verifying incremental behaviour.
    origin: >-
      Building several incremental generators exposed the same needs for typed models, structured
      output, testing, and cache verification, so those foundations became a shared framework.
    useWhen: >-
      You are building a non-trivial incremental C# source generator and want reusable modelling,
      code-writing, packaging, and testing infrastructure.
    avoidWhen: >-
      Your generator is small enough for the Roslyn APIs directly, or adopting a framework would
      hide behaviour your implementation needs to control precisely.
    repository: purview-dev/sourcegenerator-framework
    category: source-generation
    status: preview
    featured: true
    order: 40
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net8.0
      - net9.0
      - net10.0
    packages:
      - id: Purview.SourceGeneratorFramework
        description: Core helpers, models, and MSBuild integration for incremental generators.
        primary: true
      - id: Purview.SourceGeneratorFramework.Testing
        description: Framework-agnostic test runner and assertions for generator tests.
      - id: Purview.SourceGeneratorFramework.Testing.TUnit
        description: TUnit-specific test base classes and assertions.

  - id: aspire-resourcekit
    name: Aspire ResourceKit
    shortDescription: Strongly typed, source-generated resource kits for .NET Aspire.
    description: >-
      A source-generator-powered framework for structuring .NET Aspire AppHost
      resource composition as strongly typed, test-friendly classes. Generated
      host wiring, typed options, and enablement toggles keep large AppHosts
      maintainable and discoverable.
    origin: >-
      Large Aspire AppHosts repeatedly accumulated procedural resource wiring and configuration,
      creating a need for a typed, testable way to package those conventions.
    useWhen: >-
      Your Aspire AppHost has reusable resource groups, configuration, or enablement rules that
      should be strongly typed, discoverable, and testable.
    avoidWhen: >-
      Your AppHost is small and direct resource declarations remain clearer than introducing a
      resource-kit abstraction.
    repository: purview-dev/aspire-resourcekit
    category: aspire
    status: preview
    order: 50
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net10.0
    packages:
      - id: Purview.Aspire.ResourceKit
        description: Runtime and source generator for resource kits.
        primary: true

  - id: aspirec4
    name: AspireC4
    shortDescription: Live LikeC4 architecture diagrams from the Aspire resource graph.
    description: >-
      An Aspire extension that generates live LikeC4 architectural diagrams
      from the Aspire resource graph, with a Roslyn source generator for
      compile-time validation of tags, kinds, groups, and metadata.
    origin: >-
      Aspire already holds a useful model of a distributed application, so manually maintaining a
      separate architecture diagram was repetition that could be removed.
    useWhen: >-
      You use .NET Aspire and want live LikeC4 diagrams derived from the resource graph, with
      compile-time checks for architectural metadata.
    avoidWhen: >-
      You do not use Aspire, need a manually curated architecture model, or require diagrams that
      intentionally differ from the running application topology.
    repository: purview-dev/aspirec4
    category: aspire
    status: stable
    order: 55
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    packages:
      - id: AspireC4.Hosting
        description: Aspire hosting extension for the AspireC4 plugin, generating a dynamic LikeC4 architecture diagram for your Aspire application.
        primary: true

  - id: build
    name: Build
    shortDescription: The shared build, test, and release system for purview-dev.
    description: >-
      The shared build/test/release system for the purview-dev organisation. A
      Modular Pipelines based .NET tool packaged as a pinned dotnet tool, exposed
      through a GitHub composite action and thin reusable workflows. Consuming
      repositories own configuration; they do not own pipeline source code.
    origin: >-
      Maintaining near-identical build, test, pack, and release logic across repositories turned
      the pipeline itself into reusable tooling.
    useWhen: >-
      You maintain a Purview repository and want the shared, centrally versioned build and release
      conventions used across the organisation.
    avoidWhen: >-
      Your repository is outside that convention set or needs a substantially different pipeline
      whose lifecycle should remain independent.
    repository: purview-dev/build
    category: build-tooling
    status: stable
    order: 60
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net10.0
    install: dotnet-tool
    packages:
      - id: Purview.Build
        description: Pinned dotnet tool implementing the shared pipeline.
        primary: true

  - id: build-sdk
    name: Build SDK
    shortDescription: Convention-driven MSBuild SDK for .NET project defaults.
    description: >-
      A reusable MSBuild SDK NuGet package that delivers standardised .NET
      project defaults, code-style enforcement, test-framework wiring, and
      Central Package Management integration. Install it once per repo; every
      project beneath the repo root inherits everything automatically.
    origin: >-
      Repeating project properties, analyzers, test wiring, and package-management conventions in
      every repository made a centrally maintained MSBuild SDK the simpler option.
    useWhen: >-
      You want Purview's standard .NET project defaults applied consistently across an entire
      repository from one versioned SDK declaration.
    avoidWhen: >-
      Your repository follows different conventions or needs project-by-project control over the
      settings the SDK intentionally standardises.
    repository: purview-dev/build-sdk
    category: build-tooling
    status: preview
    order: 70
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - msbuild
    install: msbuild-sdk
    packages:
      - id: Purview.BuildSdk
        description: MSBuild SDK for standardised project defaults.
        primary: true

  - id: dotnet-logging-source-generators
    name: Logging Source Generators
    shortDescription: Early interface-based logging generation (archived).
    description: >-
      The original experiment in interface-based logging generation for .NET.
      Archived and superseded by the Purview Telemetry SourceGenerator, which
      generates logging together with Activities and Metrics from the same
      interfaces.
    origin: >-
      This was the original exploration of interface-driven logging generation and established the
      approach that later grew into the broader Telemetry SourceGenerator.
    useWhen: >-
      Use it only when maintaining an existing dependency that cannot yet move to its successor.
    avoidWhen: >-
      For new work, use Telemetry SourceGenerator instead; this project is archived and no longer
      actively developed.
    repository: purview-dev/dotnet-logging-source-generators
    category: source-generation
    status: archived
    supersededBy: telemetry-sourcegenerator
    order: 80
    targetFrameworks:
      - net6.0
      - net7.0
    packages: []

externalProjects:
  - id: likec4
    name: LikeC4
    shortDescription: Visualize, collaborate, and evolve software architecture with live C4 diagrams from your code.
    description: >-
      LikeC4 keeps software architecture always actual and live by modelling it
      with the C4 model in code (TypeScript/React) and rendering interactive
      diagrams. Purview maintains the AspireC4 integration that links .NET
      Aspire applications to LikeC4, and contributes to the LikeC4 project
      itself.
    url: https://likec4.dev
    repository: likec4/likec4
    category: developer-tooling
    status: stable
    featured: true
    order: 10
