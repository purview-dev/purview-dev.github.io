$schema: ../lib/manifest/schema.ts
projects:
  - id: telemetry-sourcegenerator
    name: Telemetry SourceGenerator
    shortDescription: Interface-based telemetry for .NET with zero boilerplate.
    description: >-
      A source generator that turns simple interface methods into
      OpenTelemetry-aligned Activities, structured ILogger logging, and Metrics.
      Define telemetry once on an interface; the generator emits the
      implementation, DI registration helpers, and multi-target generation —
      no runtime reflection, no boilerplate.
    origin: >-
      Repeating the same logging, activity, and metric wiring across services made telemetry a
      strong candidate for one interface-driven, compile-time implementation.
    useWhen: >-
      You want strongly typed OpenTelemetry-aligned telemetry from interfaces, with generated
      implementations and dependency-injection registration.
    avoidWhen: >-
      Your telemetry is highly dynamic, cannot be described at compile time, or is already handled
      consistently by another instrumentation layer.
    repository: purview-dev/telemetry-sourcegenerator
    category: observability
    status: stable
    featured: true
    order: 10
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net8.0
      - net9.0
      - net10.0
    packages:
      - id: Purview.Telemetry.SourceGenerator
        description: Core package with the Roslyn source generator and attribute library.
        primary: true
        targetFrameworks:
          - netstandard2.0
    useCases:
      - audience: developer
        title: Tracing, logging, and metrics from a single interface
        scenario: >-
          You want OpenTelemetry activities, structured logs, and metrics around an order service, but
          you do not want to hand-write the ActivitySource, ILogger, and Meter wiring in every class.
        code: |
          [ActivitySource]
          [Logger]
          [Meter]
          public interface IOrderServiceTelemetry
          {
              [Activity]
              [Info]
              [AutoCounter]
              Activity? PlacingOrder(int orderId, [Baggage] string region);
          }
        language: csharp
        outcome: >-
          The generator emits the implementation and an AddOrderServiceTelemetry() DI extension; you
          register it once and inject the interface wherever telemetry is needed.
        evidence: >-
          One interface replaces the ActivitySource, ILogger, and Meter boilerplate you would otherwise
          repeat in every service.
      - audience: architect
        title: Standardise telemetry names across services
        scenario: >-
          You want consistent OpenTelemetry meter and activity-source names across many services instead
          of ad-hoc string literals scattered through the codebase.
        code: |
          builder.AddServiceDefaults(
              TelemetryNames.MeterNames,
              TelemetryNames.ActivitySourceNames);
        language: csharp
        outcome: >-
          A generated TelemetryNames static class holds the names, so registration happens once at
          startup rather than in every service.
        evidence: >-
          Naming conventions are generated, so snake_case tags and hierarchical metrics stay consistent
          without a review checklist.
        docsPage: generation
    discussions: false

  - id: event-sourcing
    name: Event Sourcing
    shortDescription: Aggregate-based event sourcing for .NET across any store.
    description: >-
      A .NET event sourcing framework for building aggregate-based applications.
      Provider-agnostic store facades, source-generated aggregates and events,
      transaction coordination for multi-aggregate saves, queryable snapshots
      and read models, and storage providers for SQL Server, PostgreSQL,
      MongoDB, Azure Storage, Azure Cosmos DB, and in-memory.
    origin: >-
      Aggregate, event, persistence, and transaction patterns kept recurring across applications,
      so the reusable parts were separated from any one storage provider.
    useWhen: >-
      Your domain benefits from aggregate-based event sourcing and you want storage choices,
      snapshots, read models, and transactions behind consistent abstractions.
    avoidWhen: >-
      A conventional state-based model is sufficient, or your application does not need the
      operational and modelling trade-offs that come with event sourcing.
    repository: purview-dev/event-sourcing
    category: application-framework
    status: preview
    featured: true
    order: 20
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net8.0
      - net9.0
      - net10.0
    packages:
      - id: Purview.EventSourcing
        description: Core abstractions, aggregates, facades, transactions, DI, and source generation.
        primary: true
      - id: Purview.EventSourcing.SqlServer
        description: Azure SQL / SQL Server event stream and queryable snapshot stores.
      - id: Purview.EventSourcing.Postgres
        description: PostgreSQL event stream and queryable snapshot stores.
      - id: Purview.EventSourcing.AzureStorage
        description: Azure Table / Blob event store.
      - id: Purview.EventSourcing.MongoDB
        description: MongoDB event stream and queryable snapshot stores.
      - id: Purview.EventSourcing.CosmosDb
        description: Azure Cosmos DB queryable snapshot store.
      - id: Purview.EventSourcing.InMemory
        description: In-memory event and snapshot stores for local and test scenarios.
      - id: Purview.EventSourcing.Validation.FluentValidation
        description: FluentValidation adapter for aggregate save-time validation.
      - id: Purview.EventSourcing.Validation.ZodSharp
        description: Purview.ZodSharp adapter for aggregate save-time validation.
    useCases:
      - audience: developer
        title: An aggregate that persists as events
        scenario: >-
          You want aggregate-based event sourcing without hand-writing the event stream, snapshot, and
          transaction plumbing.
        code: |
          [Aggregate]
          public partial class OrderAggregate : AggregateBase
          {
              public string CustomerId { get; private set; } = default!;
              public decimal Total { get; private set; }

              [Event]
              public partial void CreateOrder(string customerId);

              [Event]
              public partial void AddLineItem(string productId, string productName, int quantity, decimal unitPrice);
          }
        language: csharp
        outcome: >-
          The source generator produces the aggregate plumbing; provider packages add stores for SQL
          Server, PostgreSQL, MongoDB, Azure Storage, Cosmos DB, or in-memory.
        evidence: >-
          One [Aggregate] declaration, and switching storage means swapping a provider package rather
          than rewriting the domain.
        docsPage: solution-design-guide
      - audience: architect
        title: Choose the store late, keep the domain stable
        scenario: >-
          You need to start on one database and move providers later, but you do not want persistence
          choices to leak into the domain model.
        code: |
          builder.Services.AddSqlServerEventStore();
          builder.Services.AddSqlServerSnapshotQueryableEventStore();
        language: csharp
        outcome: >-
          Domain code depends on provider-agnostic facades, while concrete stores live behind separate
          packages and registration extensions.
        evidence: >-
          SQL Server, PostgreSQL, MongoDB, Azure Storage, and Cosmos DB are interchangeable at the
          registration level, so the domain never references a store.
        docsPage: sql-server-guide
    related:
      - zodsharp
      - value-objects
    discussions: false

  - id: zodsharp
    name: ZodSharp
    shortDescription: Zero-allocation schema validation for C# — a Zod port.
    description: >-
      A high-performance schema validation library for C#, ported from
      TypeScript Zod by way of the guinhx/ZodSharp C# port. Struct-based rules,
      a fluent API, JSON Schema export and import, source-generated validators,
      and zero-allocation validation on every valid input path. Integrates with
      System.Text.Json, Newtonsoft.Json, and ASP.NET Core ProblemDetails.
    origin: >-
      Schema validation was repeatedly needed at application boundaries, but existing approaches
      did not combine a fluent Zod-style model with predictable, allocation-conscious execution.
    useWhen: >-
      You want composable C# schemas, compile-time validator generation, or JSON Schema interop with
      tight control over validation behaviour and allocations.
    avoidWhen: >-
      Data annotations or an existing validation library already cover your requirements, or Zod-style
      schemas would add an unnecessary second validation model.
    repository: purview-dev/zodsharp
    category: validation
    status: stable
    featured: true
    order: 30
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net8.0
      - net9.0
      - net10.0
    packages:
      - id: Purview.ZodSharp
        description: Core validation library and source generator.
        primary: true
      - id: Purview.ZodSharp.SystemTextJson
        description: System.Text.Json integration and JSON Schema import.
      - id: Purview.ZodSharp.NewtonsoftJson
        description: Newtonsoft.Json integration and JSON Schema import.
      - id: Purview.ZodSharp.AspNetCore
        description: ASP.NET Core ProblemDetails integration.
    related:
      - value-objects
    acknowledgments:
      - name: Zod
        url: https://github.com/colinhacks/zod
        description: The original JavaScript/TypeScript schema validation library.
      - name: ZodSharp (guinhx)
        url: https://github.com/guinhx/ZodSharp
        description: The C# port of Zod, and the fork this project is based on.
    useCases:
      - audience: developer
        title: Validate input without exceptions or allocations
        scenario: >-
          You need to validate values at an application boundary and prefer a result you can inspect
          over exception-driven control flow.
        code: |
          var nameSchema = Z.String().Min(3).Max(50);
          var result = nameSchema.Validate("John");

          if (result.IsSuccess)
              Console.WriteLine($"Valid name: {result.Value}");
        language: csharp
        outcome: >-
          Validate/SafeParse return a ValidationResult<T> with no exceptions, while Parse still throws
          ZodException when you want that behaviour.
        evidence: >-
          Validation is zero-allocation on every valid input path, so the performance claim is a
          property of the code rather than an aspiration.
        docsPage: fluent-schema-api
      - audience: team-lead
        title: Return standard ProblemDetails for invalid requests
        scenario: >-
          You want failed validation in ASP.NET Core to surface as standard ProblemDetails payloads
          rather than a bespoke error shape that clients must learn.
        code: |
          dotnet add package Purview.ZodSharp.AspNetCore
        language: bash
        outcome: >-
          The AspNetCore adapter converts failed validation results into the standard ProblemDetails /
          HttpValidationProblemDetails payloads.
        evidence: >-
          One adapter package, and API consumers keep the error contract they already expect.
        docsPage: aspnetcore-integration

  - id: value-objects
    name: Value Objects
    shortDescription: Source-generated scalar and complex value objects for .NET.
    description: >-
      F#-style single-case types for C#. Mark a partial struct or class with
      [Scalar] or [ValueObject] and an incremental source generator produces
      Create/Hydrate factories with normalization and validation, equality,
      comparison, implicit conversions, JSON converters, and contextual
      creation. Value objects serialize as their underlying value, map cleanly
      onto Entity Framework JSON columns, and can be validated with
      Purview.ZodSharp schemas.
    origin: >-
      Hand-writing the same factories, equality rules, conversions, serializers, and persistence
      integration for domain values made the pattern an obvious source-generation target.
    useWhen: >-
      Your domain uses meaningful scalar or complex value types and you want their repetitive
      implementation generated from a small, explicit declaration.
    avoidWhen: >-
      A primitive or record already expresses the concept clearly, or generated conversion and
      serialization behaviour would be more machinery than the domain needs.
    repository: purview-dev/value-objects
    category: source-generation
    status: preview
    featured: true
    order: 35
    docs:
      source: github-path
      path: docs
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net8.0
      - net9.0
      - net10.0
    packages:
      - id: Purview.ValueObjects
        description: Runtime contracts, source generator, and analyzer for scalar and complex value objects.
        primary: true
    useCases:
      - audience: developer
        title: A domain scalar without the boilerplate
        scenario: >-
          You want a strong EmailAddress type with normalisation and validation, without hand-writing
          factories, equality, conversions, and a JSON converter.
        code: |
          [Scalar]
          public readonly partial record struct EmailAddress
          {
              public string Value { get; }

              static partial void OnNormalize(ref string value)
                  => value = value?.Trim().ToLowerInvariant()!;
          }
        language: csharp
        outcome: >-
          The generator adds Create, Hydrate, TryCreate, and Empty, plus equality, comparison, implicit
          conversions, and a JSON converter.
        evidence: >-
          One declaration replaces the factory, equality, comparison, conversion, and serialization code
          you would otherwise maintain by hand.
        docsPage: value-object-design
      - audience: developer
        title: Map a value object onto an Entity Framework column
        scenario: >-
          You use a value object in your domain and want it to persist transparently instead of writing
          converters at every mapping site.
        code: |
          var email = EmailAddress.Create("  Demo@Example.COM  ");
          // email.Value == "demo@example.com"

          bool ok = EmailAddress.TryCreate("not-an-email", out _);
          // ok == false
        language: csharp
        outcome: >-
          Value objects serialize as their underlying value and map onto Entity Framework JSON columns,
          with optional Purview.ZodSharp validation.
        evidence: >-
          Persistence and serialization come from the generated type, so mapping code is not duplicated
          per entity.
        docsPage: entity-framework
    related:
      - zodsharp
      - event-sourcing

  - id: sourcegenerator-framework
    name: SourceGenerator Framework
    shortDescription: A typed framework for building incremental C# source generators.
    description: >-
      A strongly typed framework for building, testing, and maintaining
      incremental C# source generators with Roslyn. Includes structured code
      generation, attribute data models, type libraries, and a step-cache test
      runner for verifying incremental behaviour.
    origin: >-
      Building several incremental generators exposed the same needs for typed models, structured
      output, testing, and cache verification, so those foundations became a shared framework.
    useWhen: >-
      You are building a non-trivial incremental C# source generator and want reusable modelling,
      code-writing, packaging, and testing infrastructure.
    avoidWhen: >-
      Your generator is small enough for the Roslyn APIs directly, or adopting a framework would
      hide behaviour your implementation needs to control precisely.
    repository: purview-dev/sourcegenerator-framework
    category: source-generation
    status: preview
    featured: true
    order: 40
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net8.0
      - net9.0
      - net10.0
    packages:
      - id: Purview.SourceGeneratorFramework
        description: Core helpers, models, and MSBuild integration for incremental generators.
        primary: true
      - id: Purview.SourceGeneratorFramework.Testing
        description: Framework-agnostic test runner and assertions for generator tests.
      - id: Purview.SourceGeneratorFramework.Testing.TUnit
        description: TUnit-specific test base classes and assertions.
    useCases:
      - audience: contributor
        title: Build an incremental generator on typed foundations
        scenario: >-
          You are writing a non-trivial incremental C# source generator and need typed attribute
          models, structured code output, and packaging that Roslyn will actually load.
        code: |
          <ProjectReference
            Include="..\MyGenerator\MyGenerator.csproj"
            PrivateAssets="all"
            OutputItemType="Analyzer"
            ReferenceOutputAssembly="false"
          />
        language: xml
        outcome: >-
          The framework supplies attribute-data models, a structured code writer, a type library, and
          packaging helpers so the generator stays focused on its own logic.
        evidence: >-
          The Purview generators themselves are built on the framework, so it is exercised by real
          generators rather than being an untested abstraction.
        docsPage: guide
      - audience: contributor
        title: Verify incremental behaviour in tests
        scenario: >-
          You need to prove a generator is incremental and produces the code you expect, without
          assembling a Roslyn driver by hand in every test.
        outcome: >-
          The testing package provides SourceGeneratorTestRunner<TGenerator>, a framework-agnostic test
          base, and assertions such as AssertSingleGeneratedSource and AssertNoCompilationErrors.
        evidence: >-
          Step-cache tests and a TUnit integration ship alongside the runner, so incremental regressions
          surface in CI.
        docsPage: testing

  - id: aspire-resourcekit
    name: Aspire ResourceKit
    shortDescription: Strongly typed, source-generated resource kits for .NET Aspire.
    description: >-
      A source-generator-powered framework for structuring .NET Aspire AppHost
      resource composition as strongly typed, test-friendly classes. Generated
      host wiring, typed options, and enablement toggles keep large AppHosts
      maintainable and discoverable.
    origin: >-
      Large Aspire AppHosts repeatedly accumulated procedural resource wiring and configuration,
      creating a need for a typed, testable way to package those conventions.
    useWhen: >-
      Your Aspire AppHost has reusable resource groups, configuration, or enablement rules that
      should be strongly typed, discoverable, and testable.
    avoidWhen: >-
      Your AppHost is small and direct resource declarations remain clearer than introducing a
      resource-kit abstraction.
    repository: purview-dev/aspire-resourcekit
    category: aspire
    status: stable
    order: 50
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net10.0
    packages:
      - id: Purview.Aspire.ResourceKit
        description: Runtime and source generator for resource kits.
        primary: true
    useCases:
      - audience: architect
        title: Typed, testable resource groups in a large AppHost
        scenario: >-
          A large Aspire AppHost accumulates procedural resource wiring and configuration that is hard
          to test and easy to misconfigure.
        code: |
          [HostKit]
          partial class ShopHostKit;

          [ResourceDefinition<Projects.Example_Service>("api")]
          partial class ApiResourceKit
          {
              protected override IResourceBuilder<ProjectResource> BuildResource(
                  IDistributedApplicationBuilder builder)
                  => builder.AddProject<Projects.Example_Service>(Name);
          }
        language: csharp
        outcome: >-
          Resource definitions become strongly typed, source-generated classes with generated host
          wiring and typed options.
        evidence: >-
          One [HostKit] plus one [ResourceDefinition] per resource replaces procedural AppHost code, and
          the analyzer validates the wiring at compile time.
        docsPage: examples
      - audience: team-lead
        title: Configure and toggle resources without editing the AppHost
        scenario: >-
          You want enablement rules and configuration to be declarative and discoverable instead of
          buried in the AppHost entry point.
        outcome: >-
          Typed options and enablement toggles are generated for each resource kit, so behaviour is
          configured rather than coded.
        evidence: >-
          Resource kits can be unit tested with the testing helpers, independent of a running AppHost.
        docsPage: configuration-and-options

  - id: aspirec4
    name: AspireC4
    shortDescription: Live LikeC4 architecture diagrams from the Aspire resource graph.
    description: >-
      An Aspire extension that generates live LikeC4 architectural diagrams
      from the Aspire resource graph, with a Roslyn source generator for
      compile-time validation of tags, kinds, groups, and metadata.
    origin: >-
      Aspire already holds a useful model of a distributed application, so manually maintaining a
      separate architecture diagram was repetition that could be removed.
    useWhen: >-
      You use .NET Aspire and want live LikeC4 diagrams derived from the resource graph, with
      compile-time checks for architectural metadata.
    avoidWhen: >-
      You do not use Aspire, need a manually curated architecture model, or require diagrams that
      intentionally differ from the running application topology.
    repository: purview-dev/aspirec4
    category: aspire
    status: stable
    order: 55
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    packages:
      - id: AspireC4.Hosting
        description: Aspire hosting extension for the AspireC4 plugin, generating a dynamic LikeC4 architecture diagram for your Aspire application.
        primary: true
    useCases:
      - audience: developer
        title: A live architecture diagram with three lines of code
        scenario: >-
          You already describe your distributed application in Aspire and do not want to maintain a
          separate architecture diagram that drifts from reality.
        code: |
          var builder = DistributedApplication.CreateBuilder(args);

          builder.AddAspireC4();

          builder.Build().Run();
        language: csharp
        outcome: >-
          AspireC4 writes the generated LikeC4 model, starts the LikeC4 sidecar, and refreshes the
          diagram whenever the Aspire application changes.
        evidence: >-
          The diagram is derived from the running resource graph, so it cannot silently fall out of date
          the way a hand-drawn one can.
        docsPage: dashboard-integration
      - audience: architect
        title: Validate architectural metadata at compile time
        scenario: >-
          You want tags, kinds, groups, and metadata in your architecture model checked before the
          application even runs.
        outcome: >-
          A Roslyn source generator validates the architectural metadata while the AppHost compiles.
        evidence: >-
          Architectural metadata mistakes fail the build instead of surfacing in a diagram nobody reads.
        docsPage: generated-output

  - id: build
    name: Build
    shortDescription: The shared build, test, and release system for purview-dev.
    description: >-
      The shared build/test/release system for the purview-dev organisation. A
      Modular Pipelines based .NET tool packaged as a pinned dotnet tool, exposed
      through a GitHub composite action and thin reusable workflows. Consuming
      repositories own configuration; they do not own pipeline source code.
    origin: >-
      Maintaining near-identical build, test, pack, and release logic across repositories turned
      the pipeline itself into reusable tooling.
    useWhen: >-
      You maintain a Purview repository and want the shared, centrally versioned build and release
      conventions used across the organisation.
    avoidWhen: >-
      Your repository is outside that convention set or needs a substantially different pipeline
      whose lifecycle should remain independent.
    repository: purview-dev/build
    category: build-tooling
    status: stable
    order: 60
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - net10.0
    install: dotnet-tool
    packages:
      - id: Purview.Build
        description: Pinned dotnet tool implementing the shared pipeline.
        primary: true
    useCases:
      - audience: team-lead
        title: One reusable pipeline for every repository
        scenario: >-
          You maintain several repositories that each repeat the same build, test, pack, and release
          logic, and the copies drift apart.
        code: |
          # .github/workflows/pr.yml
          jobs:
            build:
              uses: purview-dev/build/.github/workflows/purview-build.yml@main
              secrets: inherit
        language: yaml
        outcome: >-
          Consumers reference the reusable workflow or composite action and configure behaviour with
          purview-build.json instead of owning pipeline source.
        evidence: >-
          Pipeline code lives in one repository; a consuming repository is a short workflow file plus
          configuration.
        docsPage: repository-ci-cd
      - audience: contributor
        title: Dogfood the same pipeline the organisation uses
        scenario: >-
          You want local commands, pull-request CI, and releases to run the exact same tool and
          conventions, rather than three approximations.
        outcome: >-
          The pipeline is a Modular Pipelines .NET tool packaged as a pinned dotnet tool, callable from
          a composite action, reusable workflows, or the local command line.
        evidence: >-
          Purview's own repositories use the published pipeline, so the tool is exercised on every
          build.
        docsPage: pipeline-modules

  - id: build-sdk
    name: Build SDK
    shortDescription: Convention-driven MSBuild SDK for .NET project defaults.
    description: >-
      A reusable MSBuild SDK NuGet package that delivers standardised .NET
      project defaults, code-style enforcement, test-framework wiring, and
      Central Package Management integration. Install it once per repo; every
      project beneath the repo root inherits everything automatically.
    origin: >-
      Repeating project properties, analyzers, test wiring, and package-management conventions in
      every repository made a centrally maintained MSBuild SDK the simpler option.
    useWhen: >-
      You want Purview's standard .NET project defaults applied consistently across an entire
      repository from one versioned SDK declaration.
    avoidWhen: >-
      Your repository follows different conventions or needs project-by-project control over the
      settings the SDK intentionally standardises.
    repository: purview-dev/build-sdk
    category: build-tooling
    status: stable
    order: 70
    docs:
      source: github-path
      path: docs/wiki
      rootPage: Getting-Started.md
      exclude:
        - _Sidebar.md
        - Home.md
        - index.md
    targetFrameworks:
      - msbuild
    install: msbuild-sdk
    packages:
      - id: Purview.BuildSdk
        description: MSBuild SDK for standardised project defaults.
        primary: true
    useCases:
      - audience: team-lead
        title: Apply repository-wide defaults from one declaration
        scenario: >-
          You want standard .NET project defaults, code-style enforcement, test wiring, and central
          package management without repeating the same properties in every project.
        code: |
          {
            "msbuild-sdks": {
              "Purview.BuildSdk": "1.0.0"
            }
          }
        language: json
        outcome: >-
          Install the SDK once via global.json and Directory.Build.props; every project beneath the
          repository root inherits everything automatically.
        evidence: >-
          One versioned SDK declaration replaces per-project property groups, so conventions are
          upgraded in one place.
        docsPage: configuration-reference
      - audience: contributor
        title: Bootstrap a new repository
        scenario: >-
          You are starting a repository and want the organisation's conventions in place before the
          first project exists.
        outcome: >-
          The SDK can bootstrap a global.json at the repository root when one is missing, then applies
          project-type detection, analyzers, and test wiring.
        evidence: >-
          Repository bootstrap, analyzers, and testing wiring are documented and generated, not copied
          between repos by hand.
        docsPage: repository-bootstrap

  - id: dotnet-logging-source-generators
