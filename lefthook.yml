# Lefthook Git hooks for the Purview-Dev website.
# Install with: just install-hooks  (or: bunx lefthook install)
#
# Note: oxfmt (oxc) does not yet support `.astro` files (oxc-project/oxc#15665),
# so `.astro` components are excluded from the formatting glob and formatted by
# hand per the project style guide. They are still linted by oxlint and
# type-checked by `astro check`.

pre-commit:
  parallel: false
  commands:
    oxfmt:
      glob: '*.{ts,tsx,css,md,mdx,json,yml,yaml,toml}'
      run: bunx oxfmt {staged_files}
    oxlint:
      glob: '*.{ts,tsx,js,jsx,astro}'
      run: bunx oxlint --fix {staged_files}
    restage:
      glob: '*.{ts,tsx,js,jsx,astro,css,md,mdx,json,yml,yaml,toml}'
      run: git add {staged_files}

pre-push:
  commands:
    validate:
      run: just validate
